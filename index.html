<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Players Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation" id="bgAnimation"></div>
    
    <header>
        <h1 class="logo">Valorant Hub</h1>
        <p class="subtitle">Descubra os melhores jogadores profissionais do mundo</p>
    </header>

    <main>
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Pesquise por nome do jogador ou equipe..."
                    autocomplete="off"
                >
                <button class="search-btn" onclick="performSearch()">
                    <span>Buscar</span>
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterByRegion('all')">Todos</button>
                <button class="filter-btn" onclick="filterByRegion('BR')">Brasil</button>
                <button class="filter-btn" onclick="filterByRegion('NA')">América do Norte</button>
                <button class="filter-btn" onclick="filterByRegion('LATAM')">América Latina</button>
                <button class="filter-btn" onclick="filterByRegion('EU')">Europa</button>
            </div>
        </div>

        <div class="results-container">
            <div class="results-header" id="resultsHeader" style="display: none;">
                <div class="results-count" id="resultsCount"></div>
                <div class="sort-options">
                    <button class="sort-btn active" onclick="sortResults('relevance')">Relevância</button>
                    <button class="sort-btn" onclick="sortResults('name')">Nome</button>
                    <button class="sort-btn" onclick="sortResults('rating')">Rating</button>
                </div>
            </div>

            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Valorant Hub. Feito com ❤️ para a comunidade de esports.</p>
        <p>Dados atualizados regularmente | Contato: valoranthub@email.com</p>
    </footer>

    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
